name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure
        run: |
          az cloud set -n azurecloud
          az-login() {
            az login --service-principal \
              --username "$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.appId')" \
              --password "$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.password')" \
              --tenant "$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.tenant')"
          }
          for (( i=1; i<=3; i++ )); do
            echo "::group::az login (attempt ${i})"
            if az-login; then echo "::endgroup::"; exit 0; fi
            echo "::endgroup::"
            sleep 10
          done
          exit 1

      - name: Log in to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}.azurecr.io

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        run: |
          REGISTRY="${{ vars.ACR_NAME }}.azurecr.io"
          IMAGE="${REGISTRY}/greenshift-jupyter"
          SHA_TAG="sha-$(git rev-parse --short HEAD)"
          TAGS="${IMAGE}:${SHA_TAG}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            TAGS="${TAGS},${IMAGE}:${VERSION}"
          fi
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            $(echo "$TAGS" | tr ',' '\n' | sed 's/^/-t /') \
            .
