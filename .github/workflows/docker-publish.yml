name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure
        run: |
          az cloud set -n azurecloud
          az-login() {
            az login --service-principal \
              --username "$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.appId')" \
              --password "$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.password')" \
              --tenant "$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.tenant')"
          }
          for (( i=1; i<=3; i++ )); do
            echo "::group::az login (attempt ${i})"
            if az-login; then echo "::endgroup::"; exit 0; fi
            echo "::endgroup::"
            sleep 10
          done
          exit 1

      - name: Log in to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}.azurecr.io

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.ACR_NAME }}.azurecr.io/greenshift-jupyter
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
