{{- if not .Values.externalSecret.enabled }}
{{- if not .Values.token }}
{{- fail "token is required when externalSecret.enabled=false. Generate one with: python3 -c \"import secrets; print(secrets.token_hex(32))\"" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: jupyter-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "jupyter.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ .Values.token | b64enc }}
  mariadb-password: {{ .Values.db.mariadb.password | b64enc }}
  mongo-password: {{ .Values.db.mongo.password | b64enc }}
  clickhouse-password: {{ .Values.db.clickhouse.password | b64enc }}
{{- end }}
