{{- if .Values.externalSecret.enabled }}
{{- if not .Values.externalSecret.remoteKeyPrefix }}
{{- fail "externalSecret.remoteKeyPrefix is required when externalSecret.enabled=true. Set it to the Helm release name of the main chart (e.g. 'greenshift-test')." }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jupyter-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "jupyter.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreName }}
    kind: {{ .Values.externalSecret.secretStoreKind }}
  target:
    name: jupyter-secret
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: {{ printf "%s--jupyter-secret--token" .Values.externalSecret.remoteKeyPrefix }}
    - secretKey: mariadb-password
      remoteRef:
        key: {{ printf "%s--readonly-db-secret--mariadb-password" .Values.externalSecret.remoteKeyPrefix }}
    - secretKey: mongo-password
      remoteRef:
        key: {{ printf "%s--readonly-db-secret--mongo-password" .Values.externalSecret.remoteKeyPrefix }}
    - secretKey: clickhouse-password
      remoteRef:
        key: {{ printf "%s--readonly-db-secret--clickhouse-password" .Values.externalSecret.remoteKeyPrefix }}
{{- end }}
